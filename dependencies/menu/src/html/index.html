<html>
  <head>
    <title>Add shortlink</title>
    <link rel="stylesheet" href="/_/public/logo.css"/>
    <link rel="stylesheet" href="/_/public/tables.css"/>
    <link rel="icon" type="image/x-icon" href="/_/public/favicon.ico"/>
    <link rel="icon" type="image/png" href="/_/public/favicon.png"/>
    {search_engines:dangerous_raw}
  </head>

  <body>
    <div id="logo"><div><span>Menu</span><img src="/_/public/logo.svg"></div></div>
    <h2>Direct</h2>
    <span class="actions">(<a href="/_/create?format=direct">New link</a>) (<a href="/menu">Learn more</a>)</span>
    <table class="autogrid links">
      <tr>
        <th>From</th>
        <th>To</th>
        <th>Owner</th>
        <th>Actions</th>
      </tr>
      {direct_links:dangerous_raw}
    </table>
    <span class="actions">(<a href="/_/create?format=direct">New link</a>) (<a href="/menu">Learn more</a>)</span>
    <h2>Regex</h2>
    <span class="actions">(<a href="/_/create?format=regex">New link</a>) (<a href="/menu">Learn more</a>)</span>
    <table class="autogrid links">
      <tr>
        <th>From</th>
        <th>To</th>
        <th>Owner</th>
        <th>Actions</th>
      </tr>
      {regex_links:dangerous_raw}
    </table>
    <span class="actions">(<a href="/_/create?format=regex">New link</a>) (<a href="/menu">Learn more</a>)</span>
  </body>
</html>
